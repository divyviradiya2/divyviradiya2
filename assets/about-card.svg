<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="220">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 11px; line-height: 1.5; }
    .kwd { fill: #c084fc; font-weight: 600; }
    .str { fill: #10b981; }
    .prop { fill: #38bdf8; }
    .num { fill: #facc15; }
    .comment { fill: #8b949e; font-style: italic; }
    .plain { fill: #e6edf3; }
  </style>

  <!-- Terminal Frame -->
  <rect x="0.5" y="0.5" width="339" height="219" rx="8" fill="url(#termBg)" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal Header Bar -->
  <rect x="0.5" y="0.5" width="339" height="28" rx="8" fill="#161b22"/>
  <rect x="0.5" y="20" width="339" height="9" fill="#161b22"/>
  <line x1="0.5" y1="28.5" x2="339.5" y2="28.5" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="16" cy="14" r="4.5" fill="#ff5f56"/>
  <circle cx="30" cy="14" r="4.5" fill="#ffbd2e"/>
  <circle cx="44" cy="14" r="4.5" fill="#27c93f"/>
  <text x="170.0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">divy@engineer: ~</text>

  <!-- Terminal Code Content -->
  <g transform="translate(18, 48)" class="mono">
    <!-- Line 1 -->
    <text y="0"><tspan class="kwd">const</tspan> <tspan class="prop">engineer</tspan> = {</text>
    
    <!-- Line 2 -->
    <text y="18" x="12"><tspan class="prop">name</tspan>: <tspan class="str">"Divy Viradiya"</tspan>,</text>
    
    <!-- Line 3 -->
    <text y="36" x="12"><tspan class="prop">education</tspan>: <tspan class="str">"LDCE • Computer Eng"</tspan>,</text>
    
    <!-- Line 4 -->
    <text y="54" x="12"><tspan class="prop">location</tspan>: <tspan class="str">"Surat, Gujarat, IN"</tspan>,</text>
    
    <!-- Line 5 -->
    <text y="72" x="12"><tspan class="prop">ventures</tspan>: [<tspan class="str">"PocketMC"</tspan>, <tspan class="str">"DS Labs"</tspan>],</text>
    
    <!-- Line 6 -->
    <text y="90" x="12"><tspan class="prop">stack</tspan>: [<tspan class="str">"Rust"</tspan>, <tspan class="str">"C#/.NET"</tspan>, <tspan class="str">"TypeScript"</tspan>],</text>
    
    <!-- Line 7 -->
    <text y="108" x="12"><tspan class="prop">craft</tspan>: <tspan class="str">"High-speed native systems"</tspan>,</text>
    
    <!-- Line 8 -->
    <text y="126" x="12"><tspan class="prop">mindset</tspan>: <tspan class="str">"Build > Talk • Zero fluff"</tspan></text>
    
    <!-- Line 9 -->
    <text y="144">};</text>

    <!-- Interactive Neon Cursor line -->
    <rect x="24" y="137" width="6" height="12" fill="#10b981" opacity="0.85"/>
  </g>
</svg>