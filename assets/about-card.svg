<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>

    <!-- Top Glow Border -->
    <linearGradient id="topBorderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glass Box Gradient -->
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Avatar Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 21px; fill: #ffffff; letter-spacing: -0.3px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #34d399; letter-spacing: 0.2px; }
    .info-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #8b949e; }
    .info-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11.5px; fill: #c9d1d9; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12.5px; fill: #e6edf3; }
    .box-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #8b949e; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 9.5px; fill: #10b981; }
  </style>

  <!-- Main Card Container -->
  <rect x="0.5" y="0.5" width="799" height="199" rx="8" fill="url(#aboutBg)" stroke="#30363d" stroke-width="1"/>
  
  <!-- Subtle Top Accent Line -->
  <path d="M 8 0.5 L 792 0.5" stroke="url(#topBorderGlow)" stroke-width="2"/>

  <!-- ================= LEFT IDENTITY COLUMN ================= -->
  <g transform="translate(28, 28)">
    <!-- Avatar / Hexagon Icon -->
    <g transform="translate(0, 2)">
      <circle cx="24" cy="24" r="23" fill="#161b22" stroke="#10b981" stroke-width="1.8"/>
      <!-- Terminal / Chip Icon inside -->
      <svg x="12" y="12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"></polyline>
        <line x1="12" y1="19" x2="20" y2="19"></line>
      </svg>
    </g>

    <!-- Name & Subtitle -->
    <g transform="translate(62, 10)">
      <text class="name" y="0">Divy Viradiya</text>
      <text class="subtitle" y="20">Systems &amp; Native Desktop Builder</text>
    </g>

    <!-- Location & Education Meta Details -->
    <g transform="translate(0, 78)">
      <!-- Location -->
      <g transform="translate(0, 0)">
        <svg x="0" y="0" width="14" height="14" viewBox="0 0 16 16" fill="#10b981">
          <path d="m12.596 11.596-3.535 3.536a1.5 1.5 0 0 1-2.122 0L3.404 11.596A6.5 6.5 0 1 1 12.596 2.404a6.5 6.5 0 0 1 0 9.192Zm-1.06-8.132A5 5 0 1 0 4.464 10.536L8 14.07l3.536-3.535a5 5 0 0 0 0-7.071ZM8 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>
        </svg>
        <text x="20" y="11" class="info-label">Location: <tspan class="info-val">Surat, Gujarat, India</tspan></text>
      </g>

      <!-- Education -->
      <g transform="translate(0, 24)">
        <svg x="0" y="0" width="14" height="14" viewBox="0 0 16 16" fill="#38bdf8">
          <path d="M0 4.75C0 3.784.784 3 1.75 3h12.5c.966 0 1.75.784 1.75 1.75v6.5A1.75 1.75 0 0 1 14.25 13H1.75A1.75 1.75 0 0 1 0 11.25v-6.5Zm1.75-.25a.25.25 0 0 0-.25.25v6.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-6.5a.25.25 0 0 0-.25-.25H1.75ZM7.25 8a.75.75 0 0 1 .75-.75h3.5a.75.75 0 0 1 0 1.5H8A.75.75 0 0 1 7.25 8Z"/>
        </svg>
        <text x="20" y="11" class="info-label">College: <tspan class="info-val">LD College of Engineering (LDCE)</tspan></text>
      </g>

      <!-- Degree & Year -->
      <g transform="translate(0, 48)">
        <svg x="0" y="0" width="14" height="14" viewBox="0 0 16 16" fill="#facc15">
          <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7-3.25v3.5a.75.75 0 0 1-.22.53l-2.25 2.25a.75.75 0 0 1-1.06-1.06L7.22 7.72V4.75a.75.75 0 0 1 1.5 0Z"/>
        </svg>
        <text x="20" y="11" class="info-label">Degree: <tspan class="info-val">2nd Year • B.Tech Computer Eng</tspan></text>
      </g>
    </g>
  </g>

  <!-- ================= VERTICAL DIVIDER ================= -->
  <line x1="335" y1="25" x2="335" y2="175" stroke="#21262d" stroke-width="1.2"/>

  <!-- ================= RIGHT VENTURES & CRAFT GRID ================= -->
  <g transform="translate(355, 24)">
    
    <!-- BOX 1: PocketMC -->
    <g transform="translate(0, 0)">
      <rect width="202" height="66" rx="6" fill="url(#boxBg)" stroke="#30363d" stroke-width="1"/>
      <g transform="translate(12, 12)">
        <!-- Tag -->
        <rect x="135" y="-3" width="45" height="15" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
        <text x="157" y="8" class="tag" text-anchor="middle">FOUNDER</text>
        
        <text class="box-title" y="8">PocketMC</text>
        <text class="box-desc" y="27">Minecraft Desktop Management</text>
        <text class="box-desc" y="40">&amp; Server Orchestration Suite</text>
      </g>
    </g>

    <!-- BOX 2: DS Labs -->
    <g transform="translate(216, 0)">
      <rect width="202" height="66" rx="6" fill="url(#boxBg)" stroke="#30363d" stroke-width="1"/>
      <g transform="translate(12, 12)">
        <!-- Tag -->
        <rect x="135" y="-3" width="45" height="15" rx="3" fill="#1e1b4b" stroke="#818cf8" stroke-width="0.8"/>
        <text x="157" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-weight="700" font-size="9.5px" fill="#a5b4fc" text-anchor="middle">FOUNDER</text>
        
        <text class="box-title" y="8">DS Labs</text>
        <text class="box-desc" y="27">Experimental Software &amp;</text>
        <text class="box-desc" y="40">Specialized Developer Utilities</text>
      </g>
    </g>

    <!-- BOX 3: EtherTransfer & Photo-Fix -->
    <g transform="translate(0, 78)">
      <rect width="202" height="68" rx="6" fill="url(#boxBg)" stroke="#30363d" stroke-width="1"/>
      <g transform="translate(12, 12)">
        <!-- Tag -->
        <rect x="135" y="-3" width="45" height="15" rx="3" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
        <text x="157" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-weight="700" font-size="9.5px" fill="#fbbf24" text-anchor="middle">CREATOR</text>
        
        <text class="box-title" y="8">EtherTransfer &amp; Photo-Fix</text>
        <text class="box-desc" y="27">High-Speed LAN Transfer Engine</text>
        <text class="box-desc" y="40">&amp; Rust Batch Photo Sorting Tool</text>
      </g>
    </g>

    <!-- BOX 4: Core Engineering Focus -->
    <g transform="translate(216, 78)">
      <rect width="202" height="68" rx="6" fill="url(#boxBg)" stroke="#30363d" stroke-width="1"/>
      <g transform="translate(12, 12)">
        <!-- Tag -->
        <rect x="138" y="-3" width="42" height="15" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="159" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-weight="700" font-size="9.5px" fill="#38bdf8" text-anchor="middle">FOCUS</text>
        
        <text class="box-title" y="8">Core Craft</text>
        <text class="box-desc" y="27">Systems &amp; Native Desktop Apps</text>
        <text class="box-desc" y="40">Rust • C# / .NET • Networking</text>
      </g>
    </g>

  </g>
</svg>