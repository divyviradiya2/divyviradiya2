<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#071a13" />
      <stop offset="100%" stop-color="#0a1310" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="titleGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: url(#titleGrad3); letter-spacing: -0.5px; }
    .card-tag { font-family: 'Fira Code', 'Segoe UI', monospace; font-size: 11px; font-weight: 600; fill: #10b981; letter-spacing: 1px; }
    .card-desc { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; font-weight: 400; }
    .pill-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .metric-val { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #34d399; }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="796" height="196" rx="14" fill="url(#bgGrad3)" stroke="url(#borderGrad3)" stroke-width="1.5" />

  <!-- Top Glass Terminal Bar -->
  <rect x="2" y="2" width="796" height="38" rx="14" fill="#081410" fill-opacity="0.6" />
  <line x1="2" y1="40" x2="798" y2="40" stroke="#10b981" stroke-opacity="0.2" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="24" cy="21" r="5.5" fill="#ef4444" opacity="0.8" />
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="60" cy="21" r="5.5" fill="#10b981" opacity="0.8" />

  <!-- Window Header Tag -->
  <text x="82" y="25" class="card-tag">SYSTEMS TOOL // BATCH IMAGE PIPELINE</text>

  <!-- Stars / Status Pill -->
  <g transform="translate(660, 10)">
    <rect width="115" height="22" rx="11" fill="url(#badgeGrad3)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <path d="M12 4.5l2.3 4.7 5.2.8-3.8 3.7.9 5.2-4.6-2.4-4.6 2.4.9-5.2-3.8-3.7 5.2-.8z" fill="#f59e0b" transform="translate(2, -0.5) scale(0.8)"/>
    <text x="28" y="15" class="metric-val">Rust Utility</text>
  </g>

  <!-- Project Icon / Visual Anchor -->
  <g transform="translate(30, 60)">
    <rect width="52" height="52" rx="12" fill="#06281e" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Image / Aperture / Processing Icon -->
    <path d="M16 16h20v20H16V16zm4 4v12h12V20H20zm14-8h-4v2h4v4h2v-4a2 2 0 00-2-2zm-24 0a2 2 0 00-2 2v4h2v-4h4v-2h-4zm24 28v-4h2v4a2 2 0 01-2 2h-4v-2h4zm-28-4h-2v4a2 2 0 002 2h4v-2h-4v-4z" fill="#34d399" />
  </g>

  <!-- Project Title & Subtitle -->
  <text x="96" y="82" class="card-title">Photo-Fix</text>
  <text x="96" y="102" class="card-desc">Lightweight, blazing-fast GUI utility to batch sort, organize, and catalog photos by year/month.</text>
  <text x="96" y="122" class="card-desc">Written in Rust with zero memory overhead, multi-threaded directory traversal, and instant processing.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(96, 142)">
    <!-- Rust Pill -->
    <g transform="translate(0, 0)">
      <rect width="72" height="26" rx="6" fill="#0e2f24" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#DEA584" />
      <text x="22" y="17" class="pill-text">Rust</text>
    </g>
    <!-- Multi-threading Pill -->
    <g transform="translate(80, 0)">
      <rect width="128" height="26" rx="6" fill="#0e2f24" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#34d399" />
      <text x="22" y="17" class="pill-text">Multi-Threaded</text>
    </g>
    <!-- GUI Pill -->
    <g transform="translate(216, 0)">
      <rect width="90" height="26" rx="6" fill="#0e2f24" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#00b4d8" />
      <text x="22" y="17" class="pill-text">Native GUI</text>
    </g>
    <!-- High Performance Pill -->
    <g transform="translate(314, 0)">
      <rect width="138" height="26" rx="6" fill="#0e2f24" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#10b981" />
      <text x="22" y="17" class="pill-text">Zero Overhead</text>
    </g>
  </g>

  <!-- Right Side Live Arrow Link Indicator -->
  <g transform="translate(735, 140)">
    <circle cx="16" cy="13" r="14" fill="#0e2f24" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M12 9l5 4-5 4" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
