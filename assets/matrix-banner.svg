  <!-- Center Floating Glassmorphic Backdrop for Contrast -->
  <rect x="150" y="45" width="600" height="130" rx="16" fill="#0d1117" fill-opacity="0.88" stroke="#238636" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Centered Typography -->
  <g text-anchor="middle">
    <!-- Main Name Header -->
    <text x="450" y="105" class="title-text">Divy Viradiya</text>
    <!-- Subtitle / Roles -->
    <text x="450" y="142" class="subtitle-text">Software Engineer  •  Systems Builder  •  Performance &amp; Tools</text>
