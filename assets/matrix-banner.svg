<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d12"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05120d"/>
    </linearGradient>

    <linearGradient id="matrixGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="90%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <style>
    .matrix-char {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      fill: url(#matrixGreen);
    }

    @keyframes matrixFall {
      0% { transform: translateY(-240px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(260px); opacity: 0; }
    }

    .col { animation: matrixFall 3s linear infinite; }
    .d1  { animation-duration: 3.2s; animation-delay: 0.0s; }
    .d2  { animation-duration: 2.6s; animation-delay: -1.4s; }
    .d3  { animation-duration: 3.8s; animation-delay: -0.7s; }
    .d4  { animation-duration: 2.9s; animation-delay: -2.1s; }
    .d5  { animation-duration: 3.4s; animation-delay: -0.3s; }
    .d6  { animation-duration: 2.4s; animation-delay: -1.8s; }
    .d7  { animation-duration: 3.9s; animation-delay: -1.1s; }
    .d8  { animation-duration: 2.8s; animation-delay: -2.6s; }
    .d9  { animation-duration: 3.3s; animation-delay: -0.9s; }
    .d10 { animation-duration: 2.5s; animation-delay: -1.9s; }
    .d11 { animation-duration: 3.7s; animation-delay: -0.5s; }
    .d12 { animation-duration: 2.7s; animation-delay: -2.3s; }
    .d13 { animation-duration: 3.1s; animation-delay: -1.2s; }
    .d14 { animation-duration: 3.6s; animation-delay: -0.8s; }
    .d15 { animation-duration: 2.3s; animation-delay: -1.7s; }
    .d16 { animation-duration: 3.5s; animation-delay: -2.5s; }
    .d17 { animation-duration: 2.9s; animation-delay: -0.2s; }
    .d18 { animation-duration: 3.3s; animation-delay: -1.5s; }
    .d19 { animation-duration: 2.6s; animation-delay: -2.0s; }
    .d20 { animation-duration: 3.8s; animation-delay: -0.6s; }
    .d21 { animation-duration: 2.8s; animation-delay: -1.3s; }
    .d22 { animation-duration: 3.4s; animation-delay: -2.2s; }
    .d23 { animation-duration: 2.5s; animation-delay: -0.4s; }
    .d24 { animation-duration: 3.6s; animation-delay: -1.6s; }
    .d25 { animation-duration: 3.0s; animation-delay: -2.7s; }

    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: 1px;
    }

    .subtitle {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 600;
      font-size: 14px;
      fill: #10b981;
      letter-spacing: 0.5px;
